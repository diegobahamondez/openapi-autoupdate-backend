name: Sync OpenAPI → Frontend

on:
  push:
    branches: [ dev ]
    paths:
      - 'openapi.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the updated spec from this repo
      - name: Checkout backend
        uses: actions/checkout@v3

      # 2) Checkout your frontend repo
      - name: Checkout frontend
        uses: actions/checkout@v3
        with:
          repository: diegobahamondez/openapi-autoupdate-frontend
          token: ${{ secrets.OPENAPI_SYNC_WORKFLOW }} # This token needs write permissions for the frontend repo
          path: frontend
          ref: dev

      # 3) Copy the root openapi.yaml into the frontend folder
      - name: Copy OpenAPI spec
        run: |
          cp openapi.yaml frontend/openapi.yaml

      # 4) Create and push a new branch, then open a PR
      - name: Create Pull Request in Frontend
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_SYNC_WORKFLOW }}
        run: |
          cd frontend
          
          # Exit if there are no changes to the spec
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to OpenAPI spec. Exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="bot/sync-openapi-${{ github.sha }}"
          git checkout -b $BRANCH_NAME
          
          git add openapi.yaml
          git commit -m "chore: sync OpenAPI spec from backend@${{ github.sha }}"
          git push --set-upstream origin $BRANCH_NAME
          
          gh pr create \
            --repo diegobahamondez/openapi-autoupdate-frontend \
            --title "chore(bot): Sync OpenAPI spec from backend" \
            --body "This PR was automatically generated to sync the OpenAPI specification from the backend repository (commit ${{ github.sha }})." \
            --base dev \
            --head $BRANCH_NAME
