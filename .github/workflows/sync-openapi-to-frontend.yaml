name: Sync OpenAPI → Frontend

on:
  push:
    branches: [ dev ]
    paths:
      - 'openapi.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the updated spec from this repo
      - name: Checkout backend
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 2) Checkout your frontend repo
      - name: Checkout frontend
        uses: actions/checkout@v3
        with:
          repository: diegobahamondez/openapi-autoupdate-frontend
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: frontend
          ref: dev 

      # 3) Copy the root openapi.yaml into the frontend folder
      - name: Copy OpenAPI spec
        run: |
          mkdir -p frontend/src/api
          cp openapi.yaml frontend/src/api/openapi.yaml

      # 4) Commit & push a new branch
      - name: Commit & push
        run: |
          cd frontend
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b sync-openapi-${{ github.sha }}
          git add src/api/openapi.yaml
          git diff --quiet || git commit -m "chore: sync OpenAPI spec from backend@${{ github.sha }}"
          git push --set-upstream origin sync-openapi-${{ github.sha }}

      # 5) Open a PR
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          branch: sync-openapi-${{ github.sha }}
          title: "Sync OpenAPI spec from backend@${{ github.sha }}"
          body: |
            Auto-generated PR to keep frontend’s OpenAPI in sync.
          base: dev
          head: sync-openapi-${{ github.sha }}
